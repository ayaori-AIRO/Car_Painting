<!doctype html><html lang="ko"><meta charset="utf-8"><title>자동차 증강 실험 진행</title>
<style>body{font:18px system-ui;background:#111827;color:#eee;max-width:900px;margin:40px auto;padding:20px}progress{width:100%;height:28px}pre{background:#1f2937;padding:20px;white-space:pre-wrap}</style>
<h1>자동차 세그멘테이션 증강 실험</h1><p>조명 → 화질 · 각 8 epoch · 같은 체크포인트와 테스트 데이터</p><h2 id="title">연결 중</h2><p id="step"></p><progress id="progress" max="100"></progress><pre id="detail"></pre>
<script>async function refresh(){try{const s=await(await fetch('/status')).json();const names={lighting:'조명',quality:'화질',baseline:'기준 모델',all:'전체'};document.getElementById('title').textContent=(names[s.experiment]||s.experiment)+' / '+s.state;document.getElementById('step').textContent=s.state==='Preparing'?`증강 생성 ${s.generated||0} / ${s.total||0}`:`Epoch ${s.epoch||0} / ${s.epochs||8} · 배치 ${s.batch||0} / ${s.batches||0}`;document.getElementById('progress').value=s.state==='Preparing'?100*(s.generated||0)/(s.total||1):100*(s.batch||0)/(s.batches||1);document.getElementById('detail').textContent=JSON.stringify(s,null,2)}catch(e){document.getElementById('title').textContent='연결 대기'}}refresh();setInterval(refresh,2000)</script></html>
