<!doctype html><html lang="ko"><meta charset="utf-8"><title>휀더 추가 학습 진행</title>
<style>body{background:#111827;color:#eee;font:18px system-ui;max-width:1000px;margin:40px auto;padding:20px}pre{white-space:pre-wrap;background:#1f2937;padding:20px}progress{width:100%;height:30px}#epoch{font-size:32px}</style>
<h1>자동차 부위 세그멘테이션 추가 학습</h1><p>YOLO11n-seg · 640 · batch 32 · 학습 시간 제한 45분</p><h2 id="state">준비 중</h2><p id="epoch"></p><progress id="bar" max="100"></progress><p id="time"></p><pre id="info"></pre>
<script>const names={Preparing:'데이터 준비 중',Training:'학습 중',Validating:'검증 중',Testing:'최종 테스트 중',Complete:'학습 및 테스트 완료',Failed:'오류 발생'};async function refresh(){try{const s=await(await fetch('/status')).json();document.getElementById('state').textContent=names[s.state]||s.state;document.getElementById('epoch').textContent=`Epoch ${s.epoch||0} / ${s.epochs||20} · 배치 ${s.batch||0} / ${s.batches||0}`;document.getElementById('bar').value=100*(s.batch||0)/(s.batches||1);document.getElementById('time').textContent=`경과 ${Math.floor(s.elapsed_seconds/60)}분 ${s.elapsed_seconds%60}초 · GPU 메모리 ${s.gpu_memory_gb||0} GB · 2초마다 갱신`;document.getElementById('info').textContent=JSON.stringify(s,null,2)}catch(e){document.getElementById('state').textContent='연결 대기 중'}}refresh();setInterval(refresh,2000)</script></html>
