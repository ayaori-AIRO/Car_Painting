<!doctype html><html lang="ko"><meta charset="utf-8"><title>통합 데이터셋 학습 진행</title>
<style>body{background:#111827;color:#eee;font:18px system-ui;max-width:1000px;margin:40px auto;padding:20px}progress{width:100%;height:30px}pre{white-space:pre-wrap;background:#1f2937;padding:20px}</style>
<h1>네 증강 통합 데이터셋 · YOLO11 세그멘테이션</h1><p>조명 · 화질 · 노이즈 · 부분 가림 / 실제 JPEG·라벨 파일 / 8 epoch</p><h2 id="state">연결 중</h2><p id="step"></p><progress id="bar" max="100"></progress><pre id="details"></pre>
<script>async function refresh(){try{let s=await(await fetch('/status')).json();document.getElementById('state').textContent=s.state+' · '+s.stage;document.getElementById('step').textContent=s.state==='Preparing'?`파일 처리 ${s.generated||0} / ${s.total||0}`:`Epoch ${s.epoch||0} / ${s.epochs||8} · 배치 ${s.batch||0} / ${s.batches||0}`;document.getElementById('bar').value=s.state==='Preparing'?100*(s.generated||0)/(s.total||1):100*(s.batch||0)/(s.batches||1);document.getElementById('details').textContent=JSON.stringify(s,null,2)}catch(e){document.getElementById('state').textContent='연결 대기'}}refresh();setInterval(refresh,2000)</script></html>
